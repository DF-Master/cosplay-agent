<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="cosplay agent">
  <rect width="1200" height="400" fill="#F6F3EC"/>

  <g font-family="'Cascadia Mono',Consolas,'Courier New',monospace">
    <text x="72" y="66" font-size="11" letter-spacing="2.5" fill="#A39A88">COSPLAY AGENT — WINDOWS · MIT</text>
  </g>

  <text x="72" y="176" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" fill="#14120F">cosplay agent</text>
  <line x1="72" y1="204" x2="292" y2="204" stroke="#D9D2C4" stroke-width="2"/>

  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
    <text x="72" y="252" font-size="19" fill="#3A342B">既然老板把我当 agent 使，不如扮演到底</text>
    <text x="72" y="288" font-size="14" fill="#8A8377">一条热键，把「已思考 45 秒，已读取 2 个文件」写进你的每句话。</text>
    <text x="72" y="344" font-family="Georgia,serif" font-style="italic" font-size="13" fill="#8F8778">所有数字均为文学创作</text>
  </g>

  <!-- 示例卡片 -->
  <rect x="690" y="88" width="440" height="224" rx="6" fill="#FFFFFF" stroke="#E6E0D2"/>
  <rect x="690" y="88" width="4" height="224" rx="2" fill="#2F6BFF"/>

  <text x="720" y="126" font-family="'Cascadia Mono',Consolas,monospace" font-size="11" letter-spacing="2" fill="#A39A88">SAMPLE OUTPUT</text>

  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
    <text x="720" y="166" font-size="13" fill="#2F6BFF">（已思考 45 秒，已读取 2 个文件）</text>
    <text x="720" y="198" font-size="14.5" fill="#14120F">这个 introduction 写得不错，</text>
    <text x="720" y="224" font-size="14.5" fill="#14120F">我对它加几条批注。</text>
  </g>

  <text x="1066" y="286" font-family="'Cascadia Mono',Consolas,monospace" font-size="11" fill="#C9C0AE">v0.1</text>
</svg>
