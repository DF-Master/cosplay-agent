<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Cosplay Agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="0.55" stop-color="#0E1730"/>
      <stop offset="1" stop-color="#101E3C"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FB8FF"/>
      <stop offset="1" stop-color="#4D8DFF"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D8DFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4D8DFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#26406E" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#dots)"/>
  <circle cx="1010" cy="60" r="220" fill="url(#glow)"/>

  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
    <rect x="80" y="68" width="196" height="30" rx="15" fill="#16233F" stroke="#2B4472"/>
    <text x="96" y="89" font-size="13" letter-spacing="2" fill="#7FA6E0">OPEN SOURCE · WINDOWS</text>

    <text x="80" y="178" font-size="66" font-weight="700" letter-spacing="4" fill="#F2F6FF">COSPLAY</text>
    <text x="80" y="262" font-size="72" font-weight="800" letter-spacing="6" fill="url(#title)">AGENT</text>

    <text x="82" y="308" font-size="20" fill="#A8BDD9">既然老板把我当 agent 使，不如扮演到底。</text>
    <text x="82" y="340" font-size="15" fill="#6E86A8">把「已思考 45 秒，已读取 3 个文件」写进你的日常聊天。</text>
  </g>

  <g>
    <rect x="672" y="96" width="452" height="208" rx="18" fill="#121C31" stroke="#2A3F66"/>
    <rect x="672" y="96" width="452" height="36" rx="18" fill="#16223C"/>
    <rect x="672" y="114" width="452" height="18" fill="#16223C"/>
    <circle cx="696" cy="114" r="4" fill="#3C5A8C"/>
    <circle cx="710" cy="114" r="4" fill="#3C5A8C"/>
    <circle cx="724" cy="114" r="4" fill="#3C5A8C"/>
    <text x="746" y="119" font-size="12" font-family="'Microsoft YaHei',sans-serif" fill="#5F7BA6">项目群 · 刚刚</text>

    <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
      <text x="696" y="166" font-size="13" fill="#8FD0FF">（🐋已思考 45 秒，已读取 2 个文件）</text>
      <text x="696" y="192" font-size="14" fill="#DCE6F5">这个 introduction 写得不错，我对它加几条批注。</text>
      <text x="696" y="216" font-size="14" fill="#DCE6F5">图我顺手改了一版，数据对不上，回头聊。</text>

      <rect x="696" y="244" width="404" height="34" rx="10" fill="#0D1526" stroke="#253A5E"/>
      <text x="712" y="266" font-size="12" fill="#5A7196">输入消息…</text>
      <rect x="1052" y="250" width="40" height="22" rx="8" fill="#4D8DFF"/>
      <text x="1062" y="266" font-size="11" fill="#0A1020" font-weight="700">Enter</text>
    </g>
  </g>
</svg>
